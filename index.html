<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Life Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Quicksand:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard">
        <h1 class="title">✨ To-Do List Life Dashboard</h1>
        
        <!-- Top Section: Time & Greeting (Paling Atas & Full Width) -->
        <div class="card greeting full-width">
            <h2><span class="icon">⏰</span> Time & Greeting</h2>
            <div class="time-display" id="current-time">--:--:--</div>
            <div class="date-display" id="current-date">Loading date...</div>
            <div class="greeting-text">
                <span id="greeting-title">Hello</span>, 
                <span id="user-name" class="editable-name" title="Klik untuk ubah nama">User</span>! ✏️
            </div>
            <div class="quote-subtext" id="quote-subtext">✨ Make today count!</div>
        </div>
        
        <!-- Middle Section: Focus Timer & To-Do List Side-by-Side -->
        <div class="grid-middle">
            <!-- Focus Timer Card -->
            <div class="card timer">
                <h2><span class="icon">⏱️</span> Focus Timer</h2>
                <div class="timer-display" id="timer-display">25:00</div>

                <div class="timer-input-group">
                    <input type="number" id="custom-minutes-input" min="0" max="180" value="25" placeholder="MM">
                    <span>m</span>
                    <input type="number" id="custom-seconds-input" min="0" max="59" value="0" placeholder="SS">
                    <span>s</span>
                </div>

                <div class="timer-controls">
                    <button class="btn start" id="start-timer">▶ Start</button>
                    <button class="btn stop" id="stop-timer" disabled>⏸ Stop</button>
                    <button class="btn reset" id="reset-timer">↺ Reset</button>
                </div>
            </div>
            
            <!-- To-Do List Card -->
            <div class="card todo">
                <h2><span class="icon">📝</span> To-Do List</h2>
                <div class="todo-input">
                    <input type="text" id="todo-input" placeholder="What needs to be done?">
                    <button class="btn add" id="add-todo">+ Add</button>
                </div>
                <div class="todo-items" id="todo-items">
                    <!-- Tasks will go here -->
                </div>
            </div>
        </div>
        
        <!-- Bottom Section: Quick Links (Paling Bawah) -->
        <div class="card links full-width">
            <h2><span class="icon">🔗</span> Quick Links</h2>
            <button class="btn add-link" id="add-link">+ Add Link</button>
            <div class="links-grid" id="links-grid">
                <!-- Links will go here -->
            </div>
        </div>
        
        <footer>
            <p>All data saved in your browser 🗄️</p>
        </footer>
    </div>
    
    <!-- Timer Notification Audio -->
    <audio id="timer-notification" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script src="js/app.js"></script>
</body>
</html>
